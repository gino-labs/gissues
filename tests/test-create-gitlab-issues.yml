---
- hosts: localhost
  become: false
  gather_facts: false
  connection: local
  roles:
    - gissues
  vars:
    gissues_api_token: "{{ lookup('env', 'GITLAB_TOKEN') }}"
    gissues_api_url: "{{ lookup('env', 'GITLAB_URL') }}"
    gissues_project_path: "{{ lookup('env', 'GITLAB_PROJECT') }}"
    gissues_validate_certs: false
    gissues_issue_list: 

      - title: Gitlab Test Issue 1
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Development
        description: "# Gitlab Test Issue 1"

      - title: Gitlab Test Issue 2
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Production
        description_path: files/test-description.md 

      - title: Gitlab Test Issue 3
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Infrastructure
        template: issue.md.j2
        template_vars:
          task_owner: Gino
          report_to: Gino
          background_details: Testing Gissues Role

      - title: Gitlab Test Issue 4
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Security
        template: test-template.md.j2
        template_vars:
          heading: 'Hello World'
          body: | 
            __Testing Gissues Role:__

            - [x] Test Create
            - [ ] Test Update
            - [ ] Test Close
            - [ ] Test Reopen
            - [ ] Test Delete
            
      - title: Gitlab Test Issue 5
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Maintenance

