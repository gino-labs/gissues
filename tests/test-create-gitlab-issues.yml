---
- hosts: localhost
  become: false
  gather_facts: false
  connection: local
  roles:
    - gissues
  vars:
    gissues_api_token: "{{ lookup('env', 'GITLAB_TOKEN') }}"
    gissues_api_url: "{{ lookup('env', 'GITLAB_URL') }}"
    gissues_project_path: "{{ lookup('env', 'GITLAB_PROJECT') }}"
    gissues_validate_certs: false
    gissues_issue_list: 

      - title: Gitlab Test Issue 1
        state: present
        closed: false
        state_filter: opened
        labels:
          - Gitlab
          - Development

      - title: Gitlab Test Issue 2
        state: present
        closed: false
        state_filter: closed
        labels:
          - Gitlab
          - Production

      - title: Gitlab Test Issue 3
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Infrastructure

      - title: Gitlab Test Issue 4
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Security

