---
- hosts: localhost
  become: false
  gather_facts: false
  connection: local
  vars:
    gissues_api_token: "{{ lookup('env', 'GITLAB_TOKEN') }}"
    gissues_api_url: "{{ lookup('env', 'GITLAB_URL') }}"
    gissues_project_path: "{{ lookup('env', 'GITLAB_PROJECT') }}"
    gissues_validate_certs: false
    gissues_issue_list: 
      - title: Gitlab Test Issue 1
        state: present
        closed: false
        state_filter: opened
        description: '# UPDATED: Gitlab Test Issue 1'
        labels:
          - Gitlab
          - To Do
      - title: Gitlab Test Issue 2
        state: present
        closed: false
        state_filter: closed
        template: issue.md.j2
        template_vars:
          task_owner: Gino
          report_to: N/A
        labels:
          - Gitlab
          - Doing
  roles:
    - gissues
