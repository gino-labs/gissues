---
- hosts: localhost
  become: false
  gather_facts: false
  connection: local
  roles:
    - gissues
  vars:
    gissues_api_token: "{{ lookup('env', 'GITLAB_TOKEN') }}"
    gissues_api_url: "{{ lookup('env', 'GITLAB_URL') }}"
    gissues_project_path: "{{ lookup('env', 'GITLAB_PROJECT') }}"
    gissues_validate_certs: false
    gissues_issue_list: 

      - title: Gitlab Test Issue 1
        state: present
        closed: false
        state_filter: opened
        labels:
          - Gitlab
          - Development
        description: "# Update Description Issue 1"

      - title: Gitlab Test Issue 2
        state: present
        closed: false
        state_filter: closed
        labels:
          - Gitlab
          - Production
          - To Do
        description_path: files/test-description.md          

      - title: Gitlab Test Issue 3
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Infrastructure
          - Doing
        template: issue.md.j2
        template_vars:
          task_owner: Gino
          report_to: ''
          background_details: Updated background details test.

      - title: Gitlab Test Issue 4
        state: present
        closed: false
        state_filter: all
        labels:
          - Gitlab
          - Security
          - Done
        template: test-template.md.j2
        template_vars:
          heading: 'Hello World'
          body: | 
            __Testing Gissues Role:__

            - [x] Test Create
            - [x] Test Update
            - [x] Test Close
            - [x] Test Reopen
            - [x] Test Delete
            
