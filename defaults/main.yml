---
# defaults file for gissues

gissues_api_token: ''
gissues_api_url: ''
gissues_project: ''
gissues_project_issues:
  - title: ''
    state: present
    description: ''
    labels: []
    assignee_ids: []
    milestone_group_id: ''
    epic_id: 0
    task_owner: ''
    report_to: ''
    task_content: ''
    delivery_specifics_content: ''
    reporting_content: ''
    background_details_content: ''
    closed: false
gissues_description_template: 'gissues_description.md.j2'
gissues_validate_certs: true
gissues_state_filter: opened

