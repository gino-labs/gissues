---
# tasks file for gissues

- name: Render Gitlab Issue Template
  ansible.builtin.set_fact:
    gissue_description: "{{ lookup('template', gissues_description_template) }}"
  when:
    - issue.use_template is defined
    - issue.use_template

- name: Set Variable Defined Description Text
  ansible.builtin.set_fact:
    gissue_description: "{{ issue.description | default('') }}"
  when:
    - issue.use_template is defined
    - not issue.use_template

# Only search opened issues when closing issue
- name: Set State Filter to Opened
  ansible.builtin.set_fact:
    gissue_state_filter: opened
  when: issue.closed

# Only search closed issues when reopening issue
- name: Set State Filter to Closed
  ansible.builtin.set_fact:
    gissue_state_filter: closed
  when: not issue.closed

- name: "Update Gitlab Issues for Project: {{ gissues_project }}"
  community.general.gitlab_issue:
    api_url: "{{ gissues_api_url }}"
    api_token: "{{ gissues_api_token }}"
    project: "{{ gissues_project }}"
    title: "{{ issue.title }}"
    description: "{{ gissue_description | default(omit) }}"
    state: "{{ issue.state | default('present') }}"
    labels: "{{ issue.labels | default(omit) }}"
    assignee_ids: "{{ issue.assignee_ids | default(omit) }}"
    milestone_search: "{{ issue.milestone_search | default(omit) }}"
    milestone_group_id: "{{ issue.milestone_group_id | default(omit) }}"
    validate_certs: "{{ gissues_validate_certs }}"
    state_filter: "{{ gissue_state_filter }}"
  register: issue_result

- name: Set Issue Facts
  ansible.builtin.set_fact:
    gissue_current_id: "{{ issue_result.issue.id }}"
    gissue_current_iid: "{{ issue_result.issue.iid }}"
    gissue_current_project_id: "{{ issue_result.issue.project_id }}"
    gissue_current_state: "{{ issue_result.issue.state }}"
    gissue_current_url: "{{ gissues_api_url }}/api/v4/projects/{{ issue_result.issue.project_id }}/issues/{{ issue_result.issue.iid }}"
  when: (issue.state | default('present')) == 'present'

- name: Assign Issue Epic/Parent
  ansible.builtin.uri:
    url: "{{ gissue_current_url }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    body_format: json
    body:
      epic_id: "{{ issue.epic_id | default(0) | int }}"
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when: (issue.state | default('present')) == 'present'

- name: Close Gitlab Issue
  ansible.builtin.uri:
    url: "{{ gissue_current_url }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    body_format: json
    body:
      state_event: close
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when:
    - (issue.state | default('present')) == 'present'
    - issue.state_filter == 'opened'
    - gissue_current_state == 'opened'
    - issue.closed | default(false)

- name: Reopen Gitlab Issue
  ansible.builtin.uri:
    url: "{{ gissue_current_url }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    body_format: json
    body:
      state_event: reopen
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when:
    - (issue.state | default('present')) == 'present'
    - issue.state_filter == 'closed'
    - gissue_current_state == 'closed'
    - not issue.closed | default(false)
