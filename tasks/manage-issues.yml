---
- name: "Update Gitlab Issue | {{ issue.title }}"
  community.general.gitlab_issue:
    api_job_token: "{{ gissues_api_job_token | default(omit) }}"
    api_oauth_token: "{{ gissues_api_oauth_token | default(omit) }}"
    api_username: "{{ gissues_api_username | default(omit) }}"
    api_password: "{{ gissues_api_password | default(omit) }}"
    api_token: "{{ gissues_api_token | default(omit) }}"
    api_url: "{{ gissues_api_url }}"
    project: "{{ gissues_project_path }}"
    title: "{{ issue.title }}"
    description: >-
      {{
        lookup('template', issue.template).strip()
        if issue.template | default('')
        else lookup('file', issue.description_path).strip()
        if issue.description_path | default('')
        else issue.description.strip()
        if issue.description is defined
        else omit
      }}
    state_filter: "{{ issue.state_filter | default('all') }}"
    state: "{{ issue.state | default('present') }}"
    labels: "{{ issue.labels | default(omit) }}"
    assignee_ids: "{{ issue.assignee_ids | default(omit) }}"
    milestone_search: "{{ issue.milestone_search | default(omit) }}"
    milestone_group_id: "{{ issue.milestone_group_id | default(omit) }}"
    issue_type: "{{ issue.issue_type | default(omit) }}"
    validate_certs: "{{ gissues_validate_certs | default(omit) }}"
    ca_path: "{{ gissues_ca_path | default(omit) }}"
  register: gissues_issue_result

#- name: Debug Issue Result
#  ansible.builtin.debug:
#    var: gissues_issue_result

- name: "Set Gitlab Issue Facts | {{ issue.title }}"
  ansible.builtin.set_fact:
    gissues_issue_current_state: "{{ gissues_issue_result.issue.state }}"
    gissues_issue_url: "{{ gissues_api_url }}/api/v4/projects/{{ gissues_issue_result.issue.project_id }}/issues/{{ gissues_issue_result.issue.iid }}"
  when: issue.state | default('present') != 'absent'

- name: "Set Gitlab Issue Epic/Parent | {{ issue.title }}"
  ansible.builtin.uri:
    url: "{{ gissues_issue_url }}?epic_id={{ issue.epic_id | int }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when:
    - issue.epic_id is defined
    - issue.state | default('present') != 'absent'
  register: gissues_epic_result

#- name: "Debug Issue Epic Result"
#  ansible.builtin.debug:
#    var: gissues_epic_result

- name: "Close Gitlab Issue | {{ issue.title }}"
  ansible.builtin.uri:
    url: "{{ gissues_issue_url }}?state_event=close"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when:
    - issue.closed | default(false)
    - gissues_issue_current_state | default('')  == 'opened' 
    - issue.state | default('present') != 'absent'
  changed_when: true
  register: gissues_issue_closed_result

#- name: "Debug Issue Closed Result | {{ issue.title }}"
#  ansible.builtin.debug:
#    var: gissues_issue_closed_result

- name: "Reopen Gitlab Issue | {{ issue.title }}"
  ansible.builtin.uri:
    url: "{{ gissues_issue_url }}?state_event=reopen"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gissues_api_token }}"
    status_code: 200
    validate_certs: "{{ gissues_validate_certs }}"
  when:
    - not issue.closed | default(false)
    - gissues_issue_current_state | default('') == 'closed' 
    - issue.state | default('present') != 'absent'
  changed_when: true
  register: gissues_issue_reopened_result

#- name: "Debug Issue Reopened Result | {{ issue.title }}"
#  ansible.builtin.debug:
#    var: gissues_issue_reopened_result

